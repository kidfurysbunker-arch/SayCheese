name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Handle Zipped Project or Nested Folders
        run: |
          # If they uploaded a zip file, unzip it
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Zip file detected. Unzipping..."
            unzip -o *.zip
            rm *.zip
          fi
          
          # Find where package.json is (in case of nested folders)
          PKG_PATH=$(find . -name package.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "Error: package.json not found in repository."
            exit 1
          fi
          
          PKG_DIR=$(dirname "$PKG_PATH")
          echo "Found package.json in: $PKG_DIR"
          
          # Move everything from PKG_DIR to current root if nested
          if [ "$PKG_DIR" != "." ]; then
            cp -rn "$PKG_DIR"/* .
          fi
      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Capacitor Setup
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Build Xcode Project
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Debug \
                     -destination 'generic/platform=iOS' \
                     -archivePath App.xcarchive \
                     archive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO
      - name: Export IPA
        run: |
          mkdir -p build/Payload
          cp -R App.xcarchive/Products/Applications/App.app build/Payload
          cd build && zip -r TracePro.ipa Payload
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TracePro-iOS-IPA
          path: build/TracePro.ipa
